<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#004f29">
  <title>Inventario de Campo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/config.js"></script>
  <script src="js/form-schema.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agol.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/basemaps.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
</head>

<body>
  <!-- ============================ HEADER ============================ -->
  <header class="app-header">
    <div class="brand">
      <img src="img/logo-idaf-mark-light.png" alt="IDAF" class="brand-logo">
      <span class="brand-sep"></span>
      <div class="brand-text">
        <h1>Inventario de Campo</h1>
        <span id="projectTitle" class="wm-title">IDAF · Forestry innovation &amp; Development</span>
      </div>
    </div>
    <nav class="header-tools" aria-label="Herramientas">
      <button class="net-pill" id="netPill" title="Estado de conexión y envíos">
        <span class="dot"></span><span id="netText">—</span>
      </button>
      <button class="hbtn" id="btnHelp" title="Cómo se usa">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .8c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17h.01"/></svg>
        <span>Ayuda</span>
      </button>
      <button class="hbtn" id="btnSettings" title="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </header>

  <main class="app-main">

    <!-- ============================ INICIO / REGISTROS ============================ -->
    <section id="vHome" class="view view-home" hidden>
      <div class="home-wrap">
        <div id="tokenBanner" class="token-banner" hidden>
          <div><b id="tokenBannerTitle"></b><span id="tokenBannerText"></span></div>
          <button class="btn btn-dark btn-sm" id="btnBannerSettings">Ir a Ajustes</button>
        </div>
        <button class="btn btn-primary btn-xl btn-block" id="btnNew">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nueva parcela
        </button>

        <div class="stats" id="stats"></div>

        <div class="sec-head">
          <div><div class="eyebrow">En este móvil</div><h3>Registros</h3></div>
          <div class="sec-tools">
            <button class="btn btn-ghost btn-sm" id="btnSyncNow" title="Enviar pendientes ahora">
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M18 2v4h-4M6 22v-4h4"/></svg> Enviar
            </button>
            <button class="btn btn-ghost btn-sm" id="btnExport" title="Exportar a Excel">
              <svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6M8 13l4 5M12 13l-4 5"/></svg> Excel
            </button>
          </div>
        </div>
        <div id="localList" class="rec-list"></div>

        <div id="serverSec" hidden>
          <div class="sec-head">
            <div><div class="eyebrow">En ArcGIS Online</div><h3>Enviados (editar)</h3></div>
            <div class="sec-tools">
              <button class="btn btn-ghost btn-sm" id="btnLoadServer">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> Cargar
              </button>
            </div>
          </div>
          <div id="serverList" class="rec-list"><p class="note">Pulsa «Cargar» con cobertura para ver los registros enviados.</p></div>
        </div>
        <p id="editNote" class="note" hidden></p>
      </div>
    </section>

    <!-- ============================ FORMULARIO ============================ -->
    <section id="vForm" class="view view-form" hidden>
      <div class="form-head">
        <button class="icon-btn" id="btnCloseForm" title="Guardar borrador y salir">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <div class="form-head-text">
          <div class="eyebrow" id="formMode">Nueva parcela</div>
          <h2 id="pageTitle"></h2>
        </div>
        <span class="saved" id="savedMark">Borrador guardado</span>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="form-scroll" id="formScroll">
        <div id="formBody" class="form-body"></div>
      </div>
      <footer class="form-nav">
        <button class="btn btn-ghost" id="btnPrev">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg> Anterior
        </button>
        <span class="page-count" id="pageCount"></span>
        <button class="btn btn-primary" id="btnNext">
          Siguiente <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </footer>
    </section>
  </main>

  <!-- ============================ MODAL ============================ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" id="btnModalClose" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFoot" class="modal-foot"></footer>
    </div>
  </div>

  <div id="busy" class="busy"><div class="spinner"></div><span id="busyText">Cargando…</span></div>
  <div id="toasts" class="toasts"></div>

  <script src="js/app.js"></script>
</body>
</html>
